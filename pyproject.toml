[project]
name = "d2l-work"
version = "0.0.0"
description = "动手学深度学习（torch 版）练习仓库"
requires-python = ">=3.14"

# 解释器和科学计算包用系统那份（Arch 的 python-pytorch-cuda 等），
# 所以这里默认不声明任何依赖，跑脚本直接 python3 即可。
# 需要系统没有的包时用 `uv add <包名>`，它会装进项目内的 .venv，
# 和系统包共存（.venv 创建时带 --system-site-packages，见 Makefile）。
dependencies = []

[tool.uv]
package = false
